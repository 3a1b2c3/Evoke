# Production source mix. The jsonl/video/caption/pose roots below are PLACEHOLDERS
# (`/path/to/world_model/...`) -- point them at your own copy of the sources before use. For a self-contained run use sample.yaml,
# which points at the single clip bundled under examples/data/.
#
# mix_4src = mix_3src_pose (scene_balanced/gameverse/dl3dv, with GT pose) + a 4th source
#   grok_skill (skill casting / VFX event).
#   Based on configs/data/mix_3src_pose.yaml, adding pose-less grok_event_v2 (supernatural VFX /
#   skill casting) for drop-warp training.
#   (Different from the legacy configs/data/bak/mix_4src.yaml: there the 4th source was grok_v2
#   with no drop-warp wiring; here it is grok_skill.)
#
# --- grok_skill semantics (drop-warp training) ---------------------------------
#   Each clip = 36s of normal scene followed by 6-15s of magic, annotated with
#   event_start_frame=864 (fixed) / event_end_frame (varies).
#   skill_source=true -> for these samples materialize: synthesize a static pose (feed plucker only)
#   + drop warp (zero warp tiers, everything invisible -> the short tier degenerates to
#   [prefix|prev_short] + real mid/long; plk still goes through the noise token) + take prefix from
#   the head frames of the load window (the pre-event scene).
#   event_window_keys -> bias the load window onto the event + place the target chunk inside
#   [event_start,event_end].
#   No pose_dir (-> has_pose=False); inline_caption (overall_caption -> prompt); video is an
#   absolute path.
#   require_full_length=true (grok clips at ~1202 frames are long enough). Already smoke-verified on
#   1 GPU: both batch kinds train, no crash, no NaN.
#
# --- ratio (unchanged for the three pose sources, same as mix_3src_pose; grok_skill takes ~8% of
#   training steps) --------------------------------------------------------------
#   Three sources raw=83636/69678/7905, x ratio -> eff 110667/19761/7905, total ~= 138333.
#   grok_skill raw=3219, ratio=3.74 -> eff ~= 12039, share 12039/150372 ~= 8.0%
#   (tunable in the 5-12% range).
#   ratio<1 = frozen subset; ratio>1 = repetition (all 3219 covered + partial repeats). Same
#   semantics as the mix_3src_pose header (evoke ratio = repeat/subsample factor, not a
#   sampling probability).

defaults:
  require_full_length: true

datasets:
  scene_balanced:
    jsonl: /path/to/world_model/Annotation/_scene_pose_balance/scene_pose_balance.merged.fixed.merged_caption.jsonl
    video_dir: /path/to/world_model/Video
    caption_dir: /path/to/world_model/Annotation
    pose_dir: /path/to/world_model/Annotation
    source_fps: null
    source_resolution: [720, 1280]
    caption_key: overall.description

  gameverse:
    jsonl: /path/to/world_model/Annotation/gameverse/gameverse_youtube_gameplay_with_static_gamestyle.merged_caption.ocr_pass.jsonl
    video_dir: /path/to/world_model/Video
    caption_dir: /path/to/world_model/Annotation
    pose_dir: /path/to/world_model/Annotation
    source_fps: null
    source_resolution: [720, 1280]
    caption_key: overall.description
    fallback_default_intrinsic: true   # pose npz stores c2w as `data`, no intrinsics key
    path_replace:
      video:  {'Video/': ''}
      prompt: {'Annotation/': ''}
      pose:   {'Annotation/': ''}

  dl3dv:
    jsonl: /path/to/world_model/Annotation/dl3dv/dl3dv.merged_caption.jsonl
    video_dir: /path/to/world_model/Video
    caption_dir: /path/to/world_model/Annotation
    pose_dir: /path/to/world_model/Annotation
    source_fps: null
    source_resolution: [720, 1280]
    caption_key: overall.description

  # --- grok_skill (skill casting / VFX event): static camera, no pose. `video` is an absolute path
  #     (video_dir ignored); inline_caption treats overall_caption as the prompt; event_window_keys
  #     drives the event localization for drop-warp.
  grok_skill:
    jsonl: /path/to/world_model/Annotation/grok_event_v2/grok_event_v2_clips.quality_filtered.jsonl
    video_dir: /path/to/world_model/Video   # ignored; `video` is absolute
    source_fps: null
    source_resolution: [720, 1280]
    inline_caption: true
    jsonl_key_map:
      overall_caption: prompt
    skill_source: true
    event_window_keys: {start: event_start_frame, end: event_end_frame}
    require_full_length: true

select: [scene_balanced, gameverse, dl3dv, grok_skill]
ratio:  [1.3232, 0.2836, 1.0000, 3.7400]
