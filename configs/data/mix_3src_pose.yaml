# Production source mix. The jsonl/video/caption/pose roots below are PLACEHOLDERS
# (`/path/to/world_model/...`) -- point them at your own copy of the sources before use. For a self-contained run use sample.yaml,
# which points at the single clip bundled under examples/data/.
#
# For stage1-GEO only: the 3-source version of mix_4src.yaml with grok_v2 removed (keeping only
#   sources that have GT pose).
#   Background: stage1 GEO training requires target_pose_c2ws (lingbot_c2ws); grok_v2 is a static
#   camera with no pose -> sampling it raises AssertionError. So this stage1 variant uses only the
#   three pose-bearing sources scene_balanced / gameverse / dl3dv.
#   All other fields (paths / keymap / path_replace / caption_key / fallback_default_intrinsic) are
#   identical to mix_4src.yaml.
#
# defaults.require_full_length=true: short clips that do not reach num_frames are skipped and
#   resampled (via the dataset retry path).
#   Reason: stage1 uses a 717-frame long context (T_lat=180=9x20); a short clip makes the VAE output
#   T_lat not divisible by latent_window=9, which trips an assert. require_full_length guarantees
#   every sample is full length -> T_lat always aligns.
#
# --- ratio (same scene/gameverse/dl3dv entries as mix_4src, unchanged) ---------------------
#   After removing grok (weight 0.125), the remaining three sources are renormalized to their
#   original relative proportions: scene/gameverse/dl3dv = 0.80/0.143/0.057.
#   evoke ratio (anchored at dl3dv=1.0): 1.3232 / 0.2836 / 1.0 -> eff 110670/19762/7905,
#   prop 0.800/0.143/0.057.
#   epoch ~= 138k. scene/dl3dv fully covered; gameverse (ratio<1) freezes a unique subset of about
#   19.8k/69.7k.
#   Same semantics as the mix_4src.yaml header (evoke ratio = repeat/subsample factor, not a
#   sampling probability).

defaults:
  require_full_length: true

datasets:
  scene_balanced:
    jsonl: /path/to/world_model/Annotation/_scene_pose_balance/scene_pose_balance.merged.fixed.merged_caption.jsonl
    video_dir: /path/to/world_model/Video
    caption_dir: /path/to/world_model/Annotation
    pose_dir: /path/to/world_model/Annotation
    source_fps: null
    source_resolution: [720, 1280]
    caption_key: overall.description

  gameverse:
    jsonl: /path/to/world_model/Annotation/gameverse/gameverse_youtube_gameplay_with_static_gamestyle.merged_caption.ocr_pass.jsonl
    video_dir: /path/to/world_model/Video
    caption_dir: /path/to/world_model/Annotation
    pose_dir: /path/to/world_model/Annotation
    source_fps: null
    source_resolution: [720, 1280]
    caption_key: overall.description
    fallback_default_intrinsic: true   # pose npz stores c2w as `data`, no intrinsics key
    path_replace:
      video:  {'Video/': ''}
      prompt: {'Annotation/': ''}
      pose:   {'Annotation/': ''}

  dl3dv:
    jsonl: /path/to/world_model/Annotation/dl3dv/dl3dv.merged_caption.jsonl
    video_dir: /path/to/world_model/Video
    caption_dir: /path/to/world_model/Annotation
    pose_dir: /path/to/world_model/Annotation
    source_fps: null
    source_resolution: [720, 1280]
    caption_key: overall.description

select: [scene_balanced, gameverse, dl3dv]
ratio:  [1.3232, 0.2836, 1.0000]
