output_dir: models/train/stage1_camera_control
logging_dir: logs
seed: 44


report_to:
  tracker_name: evoke
  wandb_name: stage1
  report_to: wandb


data_config:
  use_stage1_dataset: true
  use_stage3_dataset: false
  use_multi_dataset: true
  data_yaml_path: configs/data/sample.yaml   # bundled single-clip sample; point at your own source mix for a real run
  use_shuffle: true
  pin_memory: true
  persistent_workers: false
  force_rebuild: true
  single_res: true
  single_height: 384
  single_width: 640
  dataloader_num_workers: 6
  prefetch_factor: 1
  caption_dropout_p: 0
  id_token: ""
  num_frames: 357
  target_fps: 24


model_config:
  pretrained_model_name_or_path: models/evoke-base
  transformer_model_name_or_path: models/evoke/stage1_camera_control
  subfolder: "transformer"
  load_checkpoints_custom: false
  load_model_path: null
  load_dcp: false
  enable_slicing: false
  enable_tiling: false
  lora_rank: 256
  lora_alpha: 256.0
  lora_dropout: 0.0
  lora_layers: "all-linear"
  lora_exclude_modules:
    - down
    - up
  train_norm_layers: false

  geometric_state:
    enabled: true
    visibility_aware_noise: true
    warp_noise_sigma_invisible: 1.0
    warp_noise_sigma_min: 0.0
    warp_noise_sigma_max: 0.135
    visible_token_threshold: 0.5
    rope_alignment: true
    prefix_idx_mode: zero
    warp_rope_mode: overlap_noise
    warp_keep_clean_anchor: false
    geo_invisible_history_noise: false
    geo_warp_plucker_enabled: false

    cloud_warp:
      enabled: true
      # Depth-estimation backend behind the shared FrameBank / render pipeline.
      #   vigeo (default) = ViGeo, image-only: it takes no pose or intrinsics input, so its depth is
      #                     up-to-scale and gets rescaled by the Umeyama scale against the GT trajectory.
      #                     Source is vendored in-repo (evoke/third_party/vigeo); only the weights need
      #                     provisioning into models/ViGeo1.1 (gitignored).
      #   da3             = DepthAnything3, pose-conditioned (GT extrinsics + intrinsics are network
      #                     inputs). To go back, set backend: da3 and uncomment the da3 block below.
      # Orthogonal to render_mode below, which selects the renderer, not the geometry model.
      backend: vigeo
      vigeo:
        weights: models/ViGeo1.1
        process_res: 644
        mode: chunk               # hold the kv-cache across ingest windows: one stream, one scale
        scale_mode: anchor        # lock the median Umeyama scale of the first anchor_windows
        anchor_windows: 4
        cache_keep_frames: 6
        intr_source: gt           # GT K rescaled to the output resolution
        conf_transform: exp       # ViGeo conf is raw logits; exp maps it positive
      # da3:
      #   ckpt_path: models/DA3
      #   process_res: 644
      update_frames_per_chunk: 12
      render_mode: backward_zbuf
      render_mode_mix_prob_zbuf: 0.2
      zbuf_despeckle: true
      zbuf_despeckle_ksize: 3
      zbuf_despeckle_fill_iters: 4
      bw_fill_iters: 3
      nsrc: 8
      nearby_window: 16
      multisrc_splat: 1
      dens_thresh: 0.45
      dens_win: 7
      recall_min_cov: 0.5
      recall_margin: 0.15
      lag_sampling:
        choices: [0, 1]
        probs:  [0.7, 0.3]
      history_chunks_sampling:
        choices: [1, 2, 3, 4]
        probs:  uniform

    short_tier_noise:
      enabled: true
      sigma_min: 0.0
      sigma_max: 0.135
      target_tiers: [prefix, prev_short, mid, long]
      prefix_sigma_max: 0.0
      prev_short_sigma_max: 0.135
      mid_long_sigma_max: 0.1
      apply_at_inference: false
      sigma_lock_per_rollout: false

    warp_token_drop:
      enabled: true
      mode_probs: [0.5, 0.1, 0.2, 0.2]
      frame_drop_ratio: 0.5
      patch_drop_ratio: 0.3

    warp_saturation_corrupt:
      enabled: true
      step_prob: 0.6
      frame_prob: 0.6
      ratio_min: 0.5
      ratio_max: 1.4
      target_tiers: [warp, prev_short, mid, long]

    warp_pose_jitter:
      enabled: true
      prob: 0.5
      yaw_deg_range: [0.5, 2.0]
      pitch_deg_range: [0.5, 2.0]
      roll_deg_range: [0.0, 0.5]
      trans_frac_range: [0.0, 0.0]

  camera_control:
    enabled: false


validation_config:
  validation_steps: 100
  first_step_valid: true
  validation_height: 384
  validation_width: 640
  validation_max_num_frames: 33
  # The reference clip shipped in examples/v2v: 1280x720, 30 fps, 40.0s, with pose.npz covering
  #   60s (intrinsics [1800,3,3] + cam_c2w [1800,4,4]). The prompt is the caption segment for exactly
  #   [10s, 20s], i.e. the window selected by validation_video_start_seconds/validation_video_seconds
  #   below -- keep the three in sync if you change the window, or the text stops describing the frames.
  validation_prompts:
    - "The player continues along an elevated walkway past a wooden bridge toward a large domed structure beside ancient crenellated walls."
  validation_videos:
    - examples/v2v/clip.mp4
  validation_video_seconds: 10.0
  validation_video_start_seconds: 10.0
  validation_pose_paths:
    - examples/v2v/pose.npz
  # Resolution/fps/type describe the SOURCE the pose was solved on, and they rescale the intrinsics.
  #   Getting them wrong changes the camera translation silently -- these match the shipped pose.npz
  #   (principal point 640/360 => 1280x720) and examples/v2v/cases.jsonl (vipe, 30 fps).
  validation_pose_source_resolution: [720, 1280]
  validation_pose_source_fps: 30
  validation_pose_type: vipe
  validation_pose_max_rotation_deg: 0.0
  use_geometric_state: true
  validation_guidance_scale: 1.0
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 8
  use_dynamic_shifting: true
  time_shift_type: "exponential"


training_config:
  trainable_models: [lora]
  freeze_cross_attn: true
  use_raw_sink_frames: false
  use_geometric_state: true

  max_train_steps: 1000000000
  train_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 5e-5
  lr_scheduler: "constant"
  lr_warmup_steps: 200
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0

  mixed_precision: "bf16"
  allow_tf32: false
  gradient_checkpointing: true
  offload: false
  upcast_before_saving: false
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  vae_decode_type: "persistent"

  checkpointing_steps: 200
  checkpoints_total_limit: 10
  save_checkpoints_custom: true
  resume_from_checkpoint: null

  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 250
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "configs/deepspeed/zero3.json"

  visible_loss_weight: 1.0
  invisible_loss_weight: 1.0
  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  use_dynamic_shifting: false
  time_shift_type: "exponential"
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15

  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  latent_window_size:
    - 9

  is_random_drop: false
  random_drop_t2v_ratio: 0
  random_drop_i2v_ratio: 0
  random_drop_v2v_ratio: 0
  geo_condition_t2v_ratio: 0.1
  geo_condition_i2v_ratio: 0.2

  corrupt_model_input: true
  corrupt_mode_model_input: "downsample"
  noise_corrupt_clean_prob_model_input: 0.3
  downsample_min_corrupt_ratio_model_input: 0.5
  downsample_max_corrupt_ratio_model_input: 0.9

  corrupt_history: false

  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: true
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128

  is_amplify_history: false
  history_scale_mode: "per_head"
  is_train_full_patch_embedding: false
  is_train_lora_patch_embedding: false
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: false
  is_train_lora_multi_term_memory_patchg: false
